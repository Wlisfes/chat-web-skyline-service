server {
    listen 80;
    listen [::]:80;
    server_name skyline.lisfes.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name skyline.lisfes.com;

    ssl_certificate /etc/nginx/certs/lisfes.pem;
    ssl_certificate_key /etc/nginx/certs/lisfes-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $skyline_upstream chat-web-skyline-service:5040;
        proxy_pass http://$skyline_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
